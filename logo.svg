<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Gold geometric monogram</title>
  <desc id="desc">Gold metallic geometric monogram on a transparent background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79500b"/>
      <stop offset=".18" stop-color="#c99a2b"/>
      <stop offset=".34" stop-color="#fff4b1"/>
      <stop offset=".48" stop-color="#fffde0"/>
      <stop offset=".62" stop-color="#b88619"/>
      <stop offset=".78" stop-color="#f7e7a0"/>
      <stop offset="1" stop-color="#94650d"/>
    </linearGradient>
    <linearGradient id="goldVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d6216"/>
      <stop offset=".42" stop-color="#f5d978"/>
      <stop offset=".72" stop-color="#fff8cb"/>
      <stop offset="1" stop-color="#a87513"/>
    </linearGradient>
    <linearGradient id="goldMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b701b"/>
      <stop offset=".23" stop-color="#f1d46b"/>
      <stop offset=".38" stop-color="#fffbd0"/>
      <stop offset=".52" stop-color="#fffde9"/>
      <stop offset=".68" stop-color="#c39122"/>
      <stop offset=".86" stop-color="#f9e9a1"/>
      <stop offset="1" stop-color="#9a6b12"/>
    </linearGradient>
  </defs>
  <!-- Left upper vertical bar -->
  <path d="M151.5 86.5 H182.7 V227.8 H151.5 Z" fill="url(#goldVertical)" stroke="#fff4bf" stroke-width=".8"/>
  <!-- Upper/right angular stroke -->
  <path d="M207.2 86.5 H404.6 V228.9 H317.6 V197.4 H373.2 V117.7 H238.7 V394.7 H207.2 Z"
        fill="url(#goldMain)" stroke="#fff5c5" stroke-width=".8" stroke-linejoin="miter"/>
  <!-- Lower/left angular stroke -->
  <path d="M95.4 308.1 H179.9 Q183.0 308.1 183.0 311.2 V339.3 H126.6 V418.7 H262.6 V142.0 H293.9 V450.0 H95.4 Z"
        fill="url(#gold)" stroke="#fff3bb" stroke-width=".8" stroke-linejoin="miter"/>
  <!-- Lower right vertical bar -->
  <path d="M317.6 308.5 H348.4 V450.0 H317.6 Z" fill="url(#goldVertical)" stroke="#fff3bb" stroke-width=".8"/>
</svg>
